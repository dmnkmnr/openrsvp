name: CI

on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npm run check
      - run: cd web && npm run build
      # NOTE: `npm run test:visual` (Playwright visual regression) is intentionally
      # NOT run here: it requires a running backend/server and is not headless-safe
      # in CI without standing up the full app, so it would reliably fail.

  backend:
    name: Backend (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24', '1.25']
    # setup-go@v6+ pins GOTOOLCHAIN=local by default (a breaking change from the
    # previous "auto" default). go.mod's `go 1.25.0` directive is a minimum
    # source-compatibility floor, not the toolchain matrix entries build with;
    # restore "auto" so a matrix entry below that floor (e.g. 1.24) transparently
    # upgrades via go.mod's `toolchain` line instead of failing on `go mod download`.
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go mod download
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - run: go vet ./...
      - name: Run tests with coverage
        run: go test -race -v -coverprofile=coverage.out -covermode=atomic ./...
      - name: Print total coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Upload coverage to Codecov
        if: matrix.go == '1.25'
        uses: codecov/codecov-action@e53489f4d376d79066609109e7a95a29eb3740b1 # v7.0.0
        with:
          files: coverage.out
          fail_ci_if_error: false
      - run: go build -o /dev/null ./cmd/openrsvp

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openrsvp
          POSTGRES_PASSWORD: openrsvp
          POSTGRES_DB: openrsvp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrsvp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://openrsvp:openrsvp@localhost:5432/openrsvp_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - run: go mod download
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: Run tests against PostgreSQL
        run: go test -race ./...

  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: golangci-lint
        # Blocking gate. golangci-lint v2.12.2 binaries are built with go1.26.x
        # and type-check the go1.26 codebase cleanly (the old go/types panic on
        # v2.1.0 is gone). Findings fail the build; see .golangci.yml for the
        # enabled linters and the documented pre-existing burn-down allow-list.
        uses: golangci/golangci-lint-action@db582008a42febd596419635a5abc9d9815daa9c # v9.2.1
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    # Run on the toolchain the project actually targets. go1.26.5 patches the
    # stdlib advisory GO-2026-5856 (crypto/tls) on top of GO-2026-5037
    # (crypto/x509) and GO-2026-5039 (net/textproto) fixed in earlier point
    # releases; GOTOOLCHAIN=local pins the analysis to the installed version so
    # the scan reflects 1.26.5.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
      - name: Create frontend placeholder for go:embed
        run: mkdir -p internal/server/frontend && touch internal/server/frontend/index.html
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Run govulncheck
        # Blocking gate. Reported vulnerabilities fail the build.
        run: govulncheck ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
